
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIUPy_kDhs0Qv8dHdz42REsLjGqUJbM04",
  authDomain: "iot-with-c-program-8460e.firebaseapp.com",

  // Inga unga actual Database URL-ah paste pannunga
  databaseURL: "PASTE_YOUR_REAL_DATABASE_URL_HERE",

  projectId: "iot-with-c-program-8460e",
  storageBucket: "iot-with-c-program-8460e.firebasestorage.app",
  messagingSenderId: "817173468979",
  appId: "1:817173468979:web:dc315685ba87884fa09046",
  measurementId: "G-W2XEJ1HW0V"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const weatherRef = ref(db, "weather");

onValue(weatherRef, (snapshot) => {
  const data = snapshot.val();

  if (data) {
    document.getElementById("temperature").textContent =
      data.temperature ?? "--";

    document.getElementById("humidity").textContent =
      data.humidity ?? "--";

    document.getElementById("pressure").textContent =
      data.pressure ?? "--";
  } else {
    console.log("Firebase-la weather data innum illai.");
  }
}, (error) => {
  console.error("Firebase connection error:", error.message);
});
</script>
